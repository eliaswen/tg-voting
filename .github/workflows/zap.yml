name: OWASP ZAP

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application
        run: cargo build --locked
      - name: Start disposable PostgreSQL
        run: docker run --detach --name tg-voting-zap-postgres --publish 5432:5432 -e POSTGRES_USER=tg-voting -e POSTGRES_PASSWORD=zap -e POSTGRES_DB=tg-voting postgres:18-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 60); do
            docker exec tg-voting-zap-postgres pg_isready --username=tg-voting --dbname=tg-voting && exit 0
            sleep 2
          done
          docker logs tg-voting-zap-postgres
          exit 1
      - name: Start disposable OIDC discovery endpoint
        run: |
          python3 - <<'PY' > oidc-stub.log 2>&1 &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/.well-known/openid-configuration':
                      self.send_error(404); return
                  body = json.dumps({'issuer':'http://127.0.0.1:8765','authorization_endpoint':'http://127.0.0.1:8765/authorize','device_authorization_endpoint':'http://127.0.0.1:8765/device','token_endpoint':'http://127.0.0.1:8765/token','userinfo_endpoint':'http://127.0.0.1:8765/userinfo'}).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length', str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self, *_): pass
          HTTPServer(('127.0.0.1', 8765), Handler).serve_forever()
          PY
      - name: Start application
        env:
          DATABASE_USER: tg-voting
          DATABASE_PASSWORD: zap
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_NAME: tg-voting
          BIND_HOST: 127.0.0.1
          BIND_PORT: '3000'
          OAUTH_ISSUER: http://127.0.0.1:8765
          OAUTH_CLIENT_ID: zap
          OAUTH_CLIENT_SECRET: zap-not-a-secret
          PUBLIC_HOST: http://127.0.0.1:3000
        run: target/debug/tg-voting > zap-app.log 2>&1 & echo $! > zap-app.pid
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/health/ready && exit 0
            if ! kill -0 "$(cat zap-app.pid)" 2>/dev/null; then cat zap-app.log; exit 1; fi
            sleep 2
          done
          cat zap-app.log
          exit 1
      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          set +e
          docker run --rm --network host --volume "$GITHUB_WORKSPACE/zap-reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:3000/ -r zap.html -J zap.json
          status=$?
          set -e
          test "$status" -le 2 || exit "$status"
      - name: Convert ZAP JSON to SARIF
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('zap-reports/zap.json')
          document = json.loads(source.read_text()) if source.exists() else {}
          results = []
          for site in document.get('site', []):
              for alert in site.get('alerts', []):
                  risk = alert.get('riskcode', '0')
                  level = {'3': 'error', '2': 'warning', '1': 'note'}.get(str(risk), 'warning')
                  results.append({
                      'ruleId': alert.get('pluginid', alert.get('alertRef', 'zap-alert')),
                      'level': level,
                      'message': {'text': alert.get('name', 'ZAP alert') + ': ' + alert.get('desc', '').strip()},
                      'locations': [{'physicalLocation': {'artifactLocation': {'uri': 'zap-scan-target/'}, 'region': {'startLine': 1}}}],
                  })
          sarif = {'version': '2.1.0', '$schema': 'https://json.schemastore.org/sarif-2.1.0.json', 'runs': [{'tool': {'driver': {'name': 'OWASP ZAP'}}, 'results': results}]}
          Path('zap-reports/zap.sarif').write_text(json.dumps(sarif))
          PY
      - uses: github/codeql-action/upload-sarif@7c9a7896f03bb1f3de14c5663ed46759e27443e0 # v4.31.9
        if: always()
        with:
          sarif_file: zap-reports/zap.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-report
          path: zap-reports
          if-no-files-found: warn
