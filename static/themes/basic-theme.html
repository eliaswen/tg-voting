<!DOCTYPE html>
<html id="document" class="document theme-document basic-theme-document" lang="en">
    <head id="document-head" class="document-head theme-head basic-theme-head">
        <meta id="document-charset" class="document-meta charset-meta" charset="utf-8">
        <meta id="document-viewport" class="document-meta viewport-meta" name="viewport" content="width=device-width, initial-scale=1">
        <title id="document-title" class="document-title">$${{page_title}}</title>
    </head>
    <body id="document-body" class="document-body theme-body basic-theme-body">
        <header id="site-header" class="site-header basic-theme-header">
<table id="header-layout" class="layout-table header-layout" width="100%">
    <tr id="header-layout-row" class="layout-row header-layout-row">
        <td id="header-brand-cell" class="layout-cell brand-cell" width="180">
            <strong id="site-brand" class="site-brand">TeenGovernment Voting</strong>
        </td>

        <td id="header-navigation-cell" class="layout-cell navigation-cell" align="center">
            <nav id="site-navigation" class="site-navigation header-navigation">
            <a id="header-home-link" class="navigation-link home-link" href="/">Home</a> |
            <a id="header-elections-link" class="navigation-link elections-link" href="/elections">Elections</a> |
            <a id="header-themes-link" class="navigation-link themes-link" href="/themes">Themes</a> |
            <a id="header-about-link" class="navigation-link about-link" href="/about">About</a>
            </nav>
        </td>

        <td id="header-account-cell" class="layout-cell account-cell" width="180" align="right">
            <a id="header-account-link" class="navigation-link account-link" href="$${{login_url}}">
<button id="header-account-button" class="navigation-button account-button">$${{login_button_text}}</button>
</a>
        </td>
    </tr>
</table>
</header>

<hr id="header-divider" class="page-divider header-divider">
<main id="page-content" class="page-content theme-content basic-theme-content">
$${{page_content}}
</main>
<footer id="site-footer" class="site-footer basic-theme-footer">
<hr id="footer-divider" class="page-divider footer-divider">

<table id="footer-layout" class="layout-table footer-layout" width="100%">
<tr id="footer-layout-row" class="layout-row footer-layout-row">
<td id="footer-copyright-cell" class="layout-cell copyright-cell" width="300">
<strong id="footer-copyright" class="footer-copyright">
<a id="footer-source-link" class="external-link source-link" href="https://github.com/eliaswen/tg-voting">
Copyright © ewi and contributors
</a>
</strong>
</td>

<td id="footer-navigation-cell" class="layout-cell navigation-cell" align="center">
<nav id="footer-navigation" class="site-navigation footer-navigation">
<a id="footer-home-link" class="navigation-link home-link" href="/">Home</a> |
<a id="footer-about-link" class="navigation-link about-link" href="/about">About</a> |
<a id="footer-elections-link" class="navigation-link elections-link" href="/elections">Elections</a>
</nav>
</td>

<td id="footer-theme-cell" class="layout-cell theme-cell" width="300" align="right">
<p id="footer-theme-description" class="theme-description">This is the basic theme. It is meant for devices with the lowest level of support.
You can select your theme on the <a id="footer-settings-link" class="navigation-link settings-link" href="/settings">settings</a> page.</p>
</td>
</tr>
</table>

</footer>
    </body>
</html>
