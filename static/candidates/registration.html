<section id="candidate-registration-page" class="page candidates-page candidate-registration-page">
    <h1 id="candidate-registration-title" class="page-title candidates-title">$${{election_name}} candidate registration</h1>

    <section id="candidate-registration-status" class="page-section registration-status-section" $${{status_hidden}}>
        <p id="candidate-registration-status-message" class="status-message registration-status-message">$${{status_message}}</p>
    </section>

    <form id="candidate-registration-form" class="candidate-form registration-form" method="post" action="/elections/$${{election_uuid}}/register" $${{form_hidden}}>
        <p id="candidate-position-field" class="form-field candidate-field" $${{position_select_hidden}}>
<label id="candidate-position-label" class="form-label" for="candidate-position-select">Position</label> <select id="candidate-position-select" class="form-control position-select" name="position" $${{position_select_disabled}}>
<option id="candidate-position-president" class="select-option position-option" value="president">President</option>
<option id="candidate-position-council" class="select-option position-option" value="council">Council</option>
</select>
</p>
        <div id="candidate-fixed-position" class="form-field candidate-field" $${{position_fixed_hidden}}>
<input id="candidate-fixed-position-input" class="form-control hidden-input" type="hidden" name="position" value="$${{position}}" $${{position_fixed_disabled}}>
<p id="candidate-fixed-position-value" class="field-value position-value">Position: $${{position}}</p>
</div>
        <p id="candidate-display-name-field" class="form-field candidate-field">
<label id="candidate-display-name-label" class="form-label" for="candidate-display-name-input">Your election display name</label> <input id="candidate-display-name-input" class="form-control text-input" type="text" name="election_display_name" value="$${{display_name}}" required>
</p>
        <p id="candidate-party-field" class="form-field candidate-field">
<label id="candidate-party-label" class="form-label" for="candidate-party-input">Your party</label> <input id="candidate-party-input" class="form-control text-input" type="text" name="party" value="$${{party}}" required>
</p>
        <fieldset id="presidential-ticket-fields" class="form-fieldset ticket-fieldset">
            <legend id="presidential-ticket-legend" class="fieldset-legend ticket-legend">Presidential ticket fields</legend>
            <p id="presidential-ticket-description" class="field-description ticket-description">These fields are only used when registering for president.</p>
            <p id="vice-president-field" class="form-field candidate-field">
<label id="vice-president-label" class="form-label" for="vice-president-select">Vice president</label> <select id="vice-president-select" class="form-control candidate-select" name="vice_president_citizen_id">
<option id="vice-president-placeholder" class="select-option placeholder-option" value="">Select a vice president</option>$${{vice_president_options}}</select>
</p>
            <p id="vice-president-name-field" class="form-field candidate-field">
<label id="vice-president-name-label" class="form-label" for="vice-president-name-input">Vice president election display name</label> <input id="vice-president-name-input" class="form-control text-input" type="text" name="vice_president_display_name" value="$${{vice_president_name}}">
</p>
            <p id="vice-president-party-field" class="form-field candidate-field">
<label id="vice-president-party-label" class="form-label" for="vice-president-party-input">Vice president party</label> <input id="vice-president-party-input" class="form-control text-input" type="text" name="vice_president_party" value="$${{vice_president_party}}">
</p>
            <div id="ticket-message-fields" class="form-fields message-fields">$${{message_fields}}</div>
        </fieldset>
        <button id="candidate-registration-submit" class="form-button submit-button" type="submit">Save registration</button>
    </form>

    <form id="candidate-withdrawal-form" class="candidate-form withdrawal-form" method="post" action="/elections/$${{election_uuid}}/withdraw" $${{withdrawal_hidden}}>
<button id="candidate-withdrawal-submit" class="form-button destructive-button withdrawal-button" type="submit">Withdraw candidacy</button>
</form>

    <nav id="candidate-registration-navigation" class="page-navigation candidates-navigation">
        <a id="candidate-registration-candidates-link" class="navigation-link candidates-link" href="/elections/$${{election_uuid}}/candidates">View candidates</a> |
        <a id="candidate-registration-elections-link" class="navigation-link elections-link" href="/elections">All elections</a>
        <span id="candidate-registration-management-navigation" class="management-navigation" $${{management_hidden}}>| <a id="candidate-registration-management-link" class="navigation-link management-link" href="/manage/elections/$${{election_uuid}}/status">Manage election status and candidates</a>
</span>
    </nav>
</section>
