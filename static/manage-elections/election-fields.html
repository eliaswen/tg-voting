<p id="election-season-field" class="form-field election-field">
<label id="election-season-label" class="form-label" for="election-season-input">Season</label> <input id="election-season-input" class="form-control number-input" type="number" name="season" min="1" value="$${{season}}" required>
</p>
<p id="election-name-field" class="form-field election-field">
<label id="election-name-label" class="form-label" for="election-name-input">Name</label> <input id="election-name-input" class="form-control text-input" type="text" name="name" value="$${{name}}" required>
</p>
<p id="registration-start-field" class="form-field election-field">
<label id="registration-start-label" class="form-label" for="registration-start-input">Registration starts</label> <input id="registration-start-input" class="form-control datetime-input" type="datetime-local" name="registration_starts_at" value="$${{registration_starts_at}}">
</p>
<p id="registration-end-field" class="form-field election-field">
<label id="registration-end-label" class="form-label" for="registration-end-input">Registration ends</label> <input id="registration-end-input" class="form-control datetime-input" type="datetime-local" name="registration_ends_at" value="$${{registration_ends_at}}">
</p>
<p id="voter-code-start-field" class="form-field election-field">
<label id="voter-code-start-label" class="form-label" for="voter-code-start-input">Voter code registration starts</label> <input id="voter-code-start-input" class="form-control datetime-input" type="datetime-local" name="voter_code_registration_starts_at" value="$${{voter_code_registration_starts_at}}">
</p>
<p id="voter-code-end-field" class="form-field election-field">
<label id="voter-code-end-label" class="form-label" for="voter-code-end-input">Voter code registration ends</label> <input id="voter-code-end-input" class="form-control datetime-input" type="datetime-local" name="voter_code_registration_ends_at" value="$${{voter_code_registration_ends_at}}">
</p>
<p id="voting-start-field" class="form-field election-field">
<label id="voting-start-label" class="form-label" for="voting-start-input">Voting starts</label> <input id="voting-start-input" class="form-control datetime-input" type="datetime-local" name="voting_starts_at" value="$${{voting_starts_at}}">
</p>
<p id="voting-end-field" class="form-field election-field">
<label id="voting-end-label" class="form-label" for="voting-end-input">Voting ends</label> <input id="voting-end-input" class="form-control datetime-input" type="datetime-local" name="voting_ends_at" value="$${{voting_ends_at}}">
</p>
<p id="maximum-council-choices-field" class="form-field election-field">
<label id="maximum-council-choices-label" class="form-label" for="maximum-council-choices-input">Maximum council choices</label> <input id="maximum-council-choices-input" class="form-control number-input" type="number" name="maximum_council_choices" min="1" value="$${{maximum_council_choices}}" required>
</p>
