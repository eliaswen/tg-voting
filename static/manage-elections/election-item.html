<li id="managed-election-item" class="item managed-election-item">
    <article id="managed-election-summary-$${{election_uuid}}" class="item-summary election-summary">
        <h3 id="managed-election-name-$${{election_uuid}}" class="item-title election-name"><a id="managed-election-link-$${{election_uuid}}" class="navigation-link election-link" href="/manage/elections/$${{election_uuid}}">Season $${{season}}: $${{name}}</a></h3>
        <p id="managed-election-status-$${{election_uuid}}" class="item-detail election-status">Current status: $${{status}}</p>
        <p id="managed-election-action-$${{election_uuid}}" class="item-navigation election-navigation"><a id="managed-election-open-link-$${{election_uuid}}" class="navigation-link action-link" href="/manage/elections/$${{election_uuid}}">Open management dashboard</a></p>
    </article>
</li>
