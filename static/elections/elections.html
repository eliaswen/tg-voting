<section id="elections-page" class="page elections-page">
    <header id="elections-header" class="page-header elections-header">
        <h1 id="elections-title" class="page-title elections-title">Elections</h1>
        <p id="elections-description" class="page-description elections-description">You can view upcoming and past elections here.</p>
    </header>
    <form id="elections-search-form" class="search-form elections-search-form" method="get" action="/elections">
        <label id="elections-search-label" class="form-label search-label" for="elections-search-input">Search elections</label>
        <input id="elections-search-input" class="form-control search-input" type="search" name="q" value="$${{search_query}}" placeholder="Season, name, or status">
        <button id="elections-search-submit" class="form-button search-button" type="submit">Search</button>
        <a id="elections-search-clear" class="navigation-link clear-search-link" href="/elections">Clear</a>
    </form>
<ol id="elections-list" class="item-list elections-list">$${{election_items}}<li id="elections-empty" class="item empty-state elections-empty-state" $${{empty_hidden}}>No elections matched your search.</li>
</ol>
</section>
