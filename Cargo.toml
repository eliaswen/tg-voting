[package]
name = "tg-voting"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["clock"] }
dotenv = "0.15.0"
env = "1.0.1"
futures-util = "0.3.33"
reqwest = { version = "0.13.2", features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] }
tokio = {version = "1.53.1", features = ["rt-multi-thread", "macros"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
