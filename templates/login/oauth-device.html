<section id="device-login-page" class="page login-page device-login-page">
    <section id="device-login-pending" class="page-state login-state pending-state">
        <h1 id="device-login-title" class="page-title login-title device-login-title">Login with another device</h1>
        <p id="device-login-instructions" class="page-description login-instructions device-login-instructions">On the other device, open <a id="device-login-verification-link" class="external-link verification-link" href="{{ verification_uri }}">{{ verification_uri }}</a> and enter this code:</p>
        <p id="device-login-code" class="device-code">
<strong id="device-login-code-value" class="device-code-value">{{ user_code }}</strong>
</p>
        <p id="device-login-complete-navigation" class="page-navigation verification-navigation"{% if !has_verification_uri_complete %} hidden{% endif %}>
<a id="device-login-complete-link" class="external-link verification-link" href="{{ verification_uri_complete }}" target="_blank">Open a new tab with the code filled in</a>
</p>
        <p id="device-login-waiting" class="status-message login-status pending-message">This page will continue automatically after you approve the login.</p>
        <p id="device-login-manual" class="help-message manual-check-help">If it does not continue automatically, <a id="device-login-manual-link" class="navigation-link manual-check-link" href="/login/oauth/manual-check/{{ request_id }}">check the login status manually</a>.</p>
    </section>
</section>
<script id="device-login-script" class="page-script login-script">if(typeof EventSource!=="undefined"){const es=new EventSource("/login/oauth/status/{{ request_id }}");es.addEventListener("redirect",e=>{window.location.href=e.data;es.close()});es.addEventListener("error",e=>{es.close();window.location.href="/login/oauth/manual-check/{{ request_id }}"})}</script>
