<section id="account-appearance-page" class="page account-page account-subpage account-appearance-page">
<header id="account-appearance-header" class="page-header account-header account-appearance-header">
<h1 id="account-appearance-title" class="page-title account-title">Appearance</h1>
<p id="account-appearance-description" class="page-description account-description">Choose the theme that should be loaded when you log in.</p>
</header>
<section id="account-theme-section" class="page-section account-section theme-settings-section">
<h2 id="account-theme-title" class="section-title account-section-title">Account theme</h2>
<p id="account-theme-list" class="section-description account-section-description">The list of themes is available <a href="/themes" id="account-theme-link" class="navigation-link theme-link">here</a>.</p>
<p id="account-current-theme" class="setting-value current-theme">Current theme: <strong id="account-current-theme-name" class="theme-name">{{ current_theme }}</strong></p>
<form id="account-theme-form" class="settings-form theme-form" method="post" action="/account/set-theme">
<p id="account-theme-field" class="form-field theme-field">
<label id="account-theme-label" class="form-label theme-label" for="account-theme-select">Theme</label>
<select id="account-theme-select" class="form-control theme-select" name="theme">{% for theme in themes %}<option id="theme-option" class="select-option theme-option" value="{{ theme.0 }}"{% if selected_theme == theme.0 %} selected{% endif %}>{{ theme.1 }}</option>{% endfor %}</select>
<button id="account-theme-submit" class="form-button submit-button" type="submit">Save theme</button>
</p>
</form>
<p id="account-local-settings-description" class="setting-description">Browser-only appearance can be changed from <a id="account-local-settings-link" class="navigation-link settings-link" href="/settings">local settings</a>.</p>
</section>
<nav id="account-appearance-navigation" class="page-navigation account-navigation"><a id="account-appearance-back-link" class="navigation-link back-link" href="/account">Back to account</a></nav>
</section>
